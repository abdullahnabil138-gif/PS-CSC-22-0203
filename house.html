<!-- Door toggle script: listen on the door boxes and emit events on their hinge parents -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const leftDoor = document.querySelector('#leftDoor');
    const rightDoor = document.querySelector('#rightDoor');
    const leftHinge = document.querySelector('#leftHinge');
    const rightHinge = document.querySelector('#rightHinge');
    let leftOpen = false;
    let rightOpen = false;

    if (leftDoor && leftHinge) {
      leftDoor.addEventListener('click', function (evt) {
        leftHinge.emit(leftOpen ? 'closeLeft' : 'openLeft');
        leftOpen = !leftOpen;
      });
      // make door respond to cursor hover
      leftDoor.setAttribute('class', 'clickable');
    }

    if (rightDoor && rightHinge) {
      rightDoor.addEventListener('click', function (evt) {
        rightHinge.emit(rightOpen ? 'closeRight' : 'openRight');
        rightOpen = !rightOpen;
      });
      rightDoor.setAttribute('class', 'clickable');
    }
  });
</script>

<!-- Q/E vertical movement component for cameras -->
<script>
  AFRAME.registerComponent('qe-controls', {
    schema: { speed: { type: 'number', default: 3 } },
    init: function () {
      this.moveUp = false;
      this.moveDown = false;
      this.onKeyDown = this.onKeyDown.bind(this);
      this.onKeyUp = this.onKeyUp.bind(this);
      window.addEventListener('keydown', this.onKeyDown);
      window.addEventListener('keyup', this.onKeyUp);
    },
    remove: function () {
      window.removeEventListener('keydown', this.onKeyDown);
      window.removeEventListener('keyup', this.onKeyUp);
    },
    onKeyDown: function (evt) {
      if (evt.key === 'q' || evt.key === 'Q') this.moveUp = true;
      if (evt.key === 'e' || evt.key === 'E') this.moveDown = true;
    },
    onKeyUp: function (evt) {
      if (evt.key === 'q' || evt.key === 'Q') this.moveUp = false;
      if (evt.key === 'e' || evt.key === 'E') this.moveDown = false;
    },
    tick: function (time, delta) {
      if (!this.moveUp && !this.moveDown) return;
      var el = this.el;
      var pos = el.object3D.position;
      var deltaSec = delta / 1000;
      var speed = this.data.speed;
      if (this.moveUp) pos.y += speed * deltaSec;
      if (this.moveDown) pos.y -= speed * deltaSec;
    }
  });
</script>
